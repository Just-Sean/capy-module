# Copier template for a reusable Django module: one app, installable into any
# project made from django-starter (or any Django project).
#   copier copy gh:OWNER/django-module-starter ./dj-my-module
# Later, inside the module:  copier update

_min_copier_version: "9.4"
_subdirectory: template

# Not questions: names a module may not take, because the module would replace (or be
# replaced by) a package of the same name once installed. uv installs a module whose
# name a project's package already uses without a warning, overwriting that package's
# files: a module called "axes" would remove a django-starter project's login rate
# limiting. Taken from django-starter's uv.lock and the module's own; add to them when
# either adds a dependency. A Python standard-library name (json, email, ...) is caught
# by the module's first test run (test_app_loads_from_its_own_package).
taken_package_names:
  type: yaml
  when: false
  default: [
    # Django's own apps, the folders every django-starter project has, test setup
    django, admin, auth, contenttypes, sessions, messages, staticfiles, sites, humanize,
    postgres, sitemaps, syndication, flatpages, redirects, gis, admindocs, accounts,
    config, tests, test, migrations,
    # what django-starter projects install (import names)
    argon2, asgiref, axes, boolean, boto3, botocore, cachecontrol, certifi, cffi, cfgv,
    charset_normalizer, colorama, coverage, cyclonedx, dateutil, defusedxml, distlib,
    django_stubs_ext, django_tasks, django_tasks_db, dotenv, environ, filelock, gunicorn,
    identify, idna, iniconfig, jmespath, license_expression, markdown_it, mdurl, msgpack,
    nodeenv, packageurl, packaging, pip, pip_api, pip_audit, pip_requirements_parser,
    platformdirs, pluggy, pre_commit, psycopg, psycopg_binary, py_serializable,
    serializable, pycparser, pygments, pyparsing, pytest, pytest_cov, pytest_django,
    pytest_env, python_discovery, redis, requests, rich, ruff, s3transfer, six,
    sortedcontainers, sqlparse, storages, tomli, tomli_w, typing_extensions, tzdata,
    urllib3, virtualenv, whitenoise, yaml,
    # what the module itself installs, besides the above
    dj_database_url,
  ]
taken_distribution_names:
  type: yaml
  when: false
  default: [
    argon2-cffi, argon2-cffi-bindings, asgiref, boolean-py, boto3, botocore,
    cachecontrol, certifi, cffi, cfgv, charset-normalizer, colorama, coverage,
    cyclonedx-python-lib, defusedxml, distlib, dj-database-url, django, django-axes,
    django-environ, django-storages, django-stubs-ext, django-tasks, django-tasks-db,
    filelock, gunicorn, identify, idna, iniconfig, jmespath, license-expression,
    markdown-it-py, mdurl, msgpack, nodeenv, packageurl-python, packaging, pip, pip-api,
    pip-audit, pip-requirements-parser, platformdirs, pluggy, pre-commit, psycopg,
    psycopg-binary, py-serializable, pycparser, pygments, pyparsing, pytest, pytest-cov,
    pytest-django, pytest-env, python-dateutil, python-discovery, python-dotenv, pyyaml,
    redis, requests, rich, ruff, s3transfer, six, sortedcontainers, sqlparse, tomli,
    tomli-w, typing-extensions, tzdata, urllib3, virtualenv, whitenoise,
  ]

module_name:
  type: str
  help: Human-readable name (e.g. "Site Branding")
  default: My Module
  # Control characters (line breaks, tabs and the like) would break the generated files,
  # and invisible ones (zero-width spaces, text-direction overrides) would make the
  # generated code read differently from what it does; double quotes would make the
  # generated code fail its own format check. The length limit keeps the generated
  # lines within ruff's 100 characters.
  validator: >-
    {% if not module_name.strip() or module_name != module_name.strip() %}
    Give the module a name, without spaces at the start or end.
    {% elif module_name | regex_search('[\x00-\x1f\x7f-\x9f\u2028\u2029\u200b-\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]') %}
    Use a name without tabs, line breaks, invisible or other control characters.
    {% elif '"' in module_name %}
    Use a name without double quotes (an apostrophe is fine).
    {% elif (module_name | replace('\\', '\\\\') | length) > 40 %}
    Use at most 40 characters.
    {% endif %}

package_name:
  type: str
  help: >-
    Python import name and Django app label (e.g. "capy_theme"). Must be unique
    across the apps in any project that installs it.
  default: >-
    {{ module_name | lower | regex_replace('[^a-z0-9]+', '_')
       | regex_replace('^[^a-z]+', '') | regex_replace('_+$', '') }}
  # Refused: the names in taken_package_names above, and Python keywords. (\Z, not $:
  # $ would also accept a line break at the end.)
  validator: >-
    {% if not (package_name | regex_search('^[a-z]([a-z0-9_]*[a-z0-9])?\Z')) %}
    Use lowercase letters, digits and underscores, starting with a letter and not
    ending with an underscore.
    {% elif package_name | length > 40 %}
    Use at most 40 characters.
    {% elif package_name in taken_package_names %}
    "{{ package_name }}" is taken by Django, a package django-starter projects or the
    module itself install, or the test setup: choose another name.
    {% elif package_name in ['and', 'as', 'assert', 'async', 'await', 'break', 'class',
      'continue', 'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from',
      'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass',
      'raise', 'return', 'try', 'while', 'with', 'yield'] %}
    "{{ package_name }}" is a Python keyword: choose another name.
    {% endif %}

distribution_name:
  type: str
  help: Package name you install with `uv add` (e.g. "capy-theme")
  default: "{{ package_name | replace('_', '-') }}"
  validator: >-
    {% if not (distribution_name | regex_search('^[a-z]([a-z0-9-]*[a-z0-9])?\Z')) %}
    Use lowercase letters, digits and hyphens, starting with a letter and not ending
    with a hyphen.
    {% elif distribution_name | length > 60 %}
    Use at most 60 characters.
    {% elif distribution_name in taken_distribution_names %}
    "{{ distribution_name }}" is a package django-starter projects or the module itself
    install: choose another name.
    {% endif %}

description:
  type: str
  help: One sentence saying what the module does
  default: "{{ module_name }} for Django projects."
  validator: >-
    {% if not description.strip() or description != description.strip() %}
    Describe the module in one sentence, without spaces at the start or end.
    {% elif description | regex_search('[\x00-\x1f\x7f-\x9f\u2028\u2029\u200b-\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]') %}
    Use one line, without tabs, invisible or other control characters.
    {% elif description | length > 200 %}
    Use at most 200 characters.
    {% endif %}

github_owner:
  type: str
  help: >-
    The GitHub account or organization the module's repository belongs to (the OWNER
    in github.com/OWNER/...). Used in the install commands and the LICENSE. Change it
    later with `copier update --defaults --data github_owner=NEW`.
  validator: >-
    {% if not (github_owner | regex_search('^[A-Za-z0-9](-?[A-Za-z0-9]){0,38}\Z'))
       or github_owner | length > 39 %}
    Use the GitHub name exactly: letters, digits and single hyphens (not at the start
    or end), up to 39 characters.
    {% endif %}

license:
  type: str
  help: >-
    The module's license: MIT (anyone may use, copy and change it, keeping the notice)
    or proprietary (private: all rights reserved, no use without permission)
  choices:
    MIT: MIT
    Proprietary (all rights reserved): Proprietary

copyright_year:
  type: str
  help: The year in the copyright notice (when the module was first made)
  default: "{{ '%Y' | strftime }}"
  validator: >-
    {% if not (copyright_year | regex_search('^[0-9]{4}\Z')) %}
    Use a four-digit year.
    {% endif %}

# Not a question: the name made safe to put inside a quoted string in the generated
# Python files (a backslash would end it otherwise; double quotes are refused above).
module_name_quoted:
  type: str
  when: false
  default: >-
    {{ module_name | replace('\\', '\\\\') }}
