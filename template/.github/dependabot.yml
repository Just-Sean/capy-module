# Dependabot (GitHub): opens a pull request when a newer version of something the
# module uses comes out, security fixes included. Also turn on "Dependabot alerts" and
# "Dependabot security updates" in the repository's Settings > Code security, so known
# vulnerabilities get a pull request straight away, not only at the weekly check.
version: 2
updates:
  # Python packages: pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  # The actions CI uses, pinned to commit hashes in .github/workflows/: without this
  # they'd never be updated.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
